<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password reset</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:Arial,sans-serif;">
<div style="max-width:600px;margin:40px auto;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,0.08);">

    <div style="background:linear-gradient(135deg,#2563eb,#1e40af);color:white;text-align:center;padding:32px 24px;">
        <h1 style="margin:0;font-size:26px;">Your new password</h1>
    </div>

    <div style="padding:32px 24px;color:#333;line-height:1.6;">
        <p>Hello,</p>
        <p>An administrator has reset your Smart Wallet account password.</p>
        <p>Please sign in with the new password below and change it after signing in.</p>

        <div style="word-break:break-all;background:#f8fafc;padding:16px;border-radius:8px;font-size:20px;font-weight:bold;color:#1e40af;text-align:center;letter-spacing:1px;">
            {{NEW_PASSWORD}}
        </div>

        <p style="margin-top:24px;">If you did not request this action, please contact an administrator.</p>
    </div>

    <div style="background-color:#f8fafc;text-align:center;font-size:13px;color:#64748b;padding:20px;">
        © 2026 Smart Wallet Service
    </div>
</div>
</body>
</html>
